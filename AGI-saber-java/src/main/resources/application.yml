    # model: bge-small-zh-v1.5

    # api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings
    # api-key: "sk-d144ab6f448546928a8f88550a658a68"
    # model: text-embedding-async-v1

    api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings
    api-key: "sk-d144ab6f448546928a8f88550a658a68"
    model: text-embedding-v3
    
  #  api-url: http://127.0.0.1:11434/v1
  #  api-key: dummy
  #  model: qllama/bge-small-zh-v1.5

    # api-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # api-key: sk-c31fed497a9e42acbecc7599710e8345
    # model: qwen3-max
  milvus:
    host: localhost
    port: 19530
  postgres:
    host: localhost
    port: 5432
    user: aiagent
    password: aiagent123
    database: aiagent
  elasticsearch:
    addresses: http://localhost:19200
    username: elastic
    password: changeme
  kafka:
    brokers: localhost:29092
    topic: agent-events
  rag:
    chunk-size: 200
    chunk-overlap: 50
    top-k: 3
    rrf-constant-k: 60
    semantic-weight: 0.7
    enable-hybrid-search: true
    rag-milvus-dim: 1024
  memory:
    short-term-max-turns: 5
    long-term-top-k: 3
    consolidation:
      similarity-threshold: 0.80
      dedup-threshold: 0.95
      ttl-days: 30
      decay-rate: 0.995
      min-importance: 0.3
      trigger-interval: 5
  harness:
    max-retries: 3
    retry-delay-ms: 200
    step-timeout-ms: 5000
    max-iterations: 5
  search:
    api-key: "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"
    api-url: "https://api.tavily.com/search"

  # ===== 知识图谱（Neo4j，可选）=====
  neo4j:
    uri: "bolt://localhost:7687"
    user: "neo4j"
    password: "password123"
    max-hops: 2
    weight: 0.3
    enabled: true

  # ===== 沙箱执行（用于终端命令工具）=====
  sandbox:
    enabled: true
    backend: "docker"        # docker | local | mock
    image: "alpine:3.19"
    timeout-ms: 30000
    max-output-bytes: 65536
    memory-limit-mb: 256
    cpu-percent: 50
    max-pids: 64
    network-disabled: true
    readonly-rootfs: true

  # ===== 命令安全校验 =====
  security:
    max-command-length: 500
    allowlist-mode: false
    allowlist:
      - "ls"
      - "cat"
      - "echo"
      - "pwd"
      - "date"
      - "python3"
      - "node"
      - "go"
      - "java"
