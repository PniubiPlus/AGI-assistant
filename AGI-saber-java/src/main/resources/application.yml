    # api-key: "97443eb3-4d60-4738-bf9d-e7bf364566d2"
    api-key: "sk-yltwedyitdqugfuxxhqyhnsxlepjrethiiasufqrqmabxfcj"
    # model: ep-20260430233018-tqktj
    model: tencent/Hunyuan-MT-7B
    temperature: 0.7
  embedding:
    # api-url: http://127.0.0.1:11434/v1/embeddings
